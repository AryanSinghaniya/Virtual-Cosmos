name: Continuous Deployment (CD) - AWS ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to AWS ECS Fargate
    runs-on: ubuntu-latest
    if: github.repository_owner == 'AryanSinghaniya'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Backend to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/virtual-cosmos-backend:$IMAGE_TAG -f deploy/docker/Dockerfile.backend ./backend
          docker tag $ECR_REGISTRY/virtual-cosmos-backend:$IMAGE_TAG $ECR_REGISTRY/virtual-cosmos-backend:latest
          docker push $ECR_REGISTRY/virtual-cosmos-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/virtual-cosmos-backend:latest

      - name: Deploy to AWS ECS Service
        run: |
          aws ecs update-service --cluster cosmos-cluster --service cosmos-backend-service --force-new-deployment
