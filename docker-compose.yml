version: '3.8'

services:
  # 1. PostgreSQL Database with pgvector & PostGIS Extensions
  db:
    image: pgvector/pgvector:pg16
    container_name: cosmos_postgres
    restart: always
    environment:
      POSTGRES_DB: virtual_cosmos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cosmos_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_cosmos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: cosmos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Asynchronous Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    container_name: cosmos_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=super-secret-production-cosmos-key-jwt-2026
      - DATABASE_URL=postgresql+asyncpg://postgres:cosmos_secure_password_2026@db:5432/virtual_cosmos
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_POSTGIS=True
      - ENABLE_PGVECTOR=True
      - BACKEND_CORS_ORIGINS=["*"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. React 18+ Frontend with Nginx Reverse Proxy
  frontend:
    build:
      context: ./client
      dockerfile: ../deploy/docker/Dockerfile.frontend
    container_name: cosmos_frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
